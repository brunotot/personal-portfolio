  <body>
    <div id="root"></div>
    <!--
      Restores the original path after a GitHub Pages SPA 404 redirect
      (paired with public/404.html). Must run before the app bootstraps.
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
    
  </body>
