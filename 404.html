<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <!--
      Single Page App fallback for GitHub Pages (and other static hosts).
      When a user opens a client-side route directly (e.g. /personal-portfolio/company),
      the host serves this 404 page. The script below rewrites the URL into a
      query string and redirects to index.html, where a matching snippet restores
      the original path so React Router can handle it.
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      // Number of path segments to keep (project pages live under /<repo>/).
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
